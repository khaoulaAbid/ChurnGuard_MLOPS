repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--fix"]
      - id: ruff-format
        name: ruff (format)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (strict on churnguard)
        args: ["--config-file=pyproject.toml"]
        pass_filenames: false
        additional_dependencies:
          - pandas
          - numpy
          - scikit-learn
