services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    container_name: churnguard-mlflow
    working_dir: /mlflow
    volumes:
      - mlruns_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --serve-artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 20s
    ports:
      - "5000:5000"
    networks:
      - churnguard_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churnguard-api
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_NAME=churnguard
      - MODEL_URI=models:/churnguard/Production
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - churnguard_net
    restart: unless-stopped

volumes:
  mlruns_data:
    driver: local

networks:
  churnguard_net:
    driver: bridge
