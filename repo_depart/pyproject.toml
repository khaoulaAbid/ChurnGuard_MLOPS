[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "churnguard"
version = "0.1.0"
description = "MLOps project for churn prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "mlflow>=2.16.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.6",
  "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["churnguard", "api"]

[dependency-groups]
dev = [
  "pre-commit>=3.8.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["churnguard", "tests", "scripts", "api"]
extend-exclude = ["notebook", ".venv", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["churnguard"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need real data files (skipped if absent)",
]